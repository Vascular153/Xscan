<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Xscan</title>
    <meta
      name="description"
      content="Xscan — сервис для анализа исходного кода, поиска уязвимостей и оценки безопасности программных проектов с помощью искусственного интеллекта."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <span class="logo">Xscan</span>
      </div>
    </header>

    <main class="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <h1 class="headline">
            Найди то,<br />
            что скрыто<span class="text-red">.</span>
          </h1>
          <p class="lead">
            Xscan — сервис для анализа исходного кода, поиска уязвимостей и оценки безопасности программных проектов с помощью искусственного интеллекта.
          </p>
          <a class="cta" href="upload/upload.html">Проверить код →</a>
        </div>

        <div class="hero-visual">
          <div class="eye">
            <div class="eye-glow"></div>
            <svg
              class="eye-svg"
              viewBox="0 0 280 180"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <defs>
                <filter id="eye-glow-deep" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="3" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
                <radialGradient id="iris-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#ff5970" />
                  <stop offset="55%" stop-color="#ff2a44" />
                  <stop offset="100%" stop-color="#2a0006" />
                </radialGradient>
                <linearGradient
                  id="eye-outline"
                  x1="20"
                  y1="30"
                  x2="260"
                  y2="150"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#ffffff" stop-opacity="0.08" />
                  <stop offset="0.5" stop-color="#ff2a44" stop-opacity="0.9" />
                  <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
                </linearGradient>
              </defs>

              <g class="eye-frame">
                <path
                  d="M 20 90 Q 140 10 260 90 Q 140 170 20 90 Z"
                  stroke="url(#eye-outline)"
                  stroke-width="2"
                  filter="url(#eye-glow-deep)"
                />
                <path
                  d="M 40 90 Q 140 32 240 90 Q 140 148 40 90 Z"
                  stroke="rgba(255, 42, 68, 0.48)"
                  stroke-width="1"
                  fill="rgba(8, 8, 12, 0.82)"
                />
                <path
                  d="M 16 65 V 50 H 38 M 264 115 V 130 H 242"
                  stroke="rgba(255, 42, 68, 0.5)"
                  stroke-width="1.5"
                />
                <path
                  d="M 16 115 V 130 H 38 M 264 65 V 50 H 242"
                  stroke="rgba(255, 255, 255, 0.12)"
                  stroke-width="1"
                />
              </g>

              <line x1="14" y1="90" x2="36" y2="90" stroke="#ff2a44" stroke-width="1.8" />
              <line x1="244" y1="90" x2="266" y2="90" stroke="#ff2a44" stroke-width="1.8" />
              <circle cx="140" cy="21" r="2.5" fill="#ff2a44" />
              <circle cx="140" cy="159" r="2.5" fill="#ff2a44" />

              <g class="reticle-spin">
                <circle
                  cx="140"
                  cy="90"
                  r="46"
                  stroke="rgba(255, 42, 68, 0.45)"
                  stroke-width="1.4"
                  stroke-dasharray="10 6 22 6"
                />
                <circle
                  cx="140"
                  cy="90"
                  r="56"
                  stroke="rgba(255, 255, 255, 0.1)"
                  stroke-width="1"
                  stroke-dasharray="4 14"
                />
              </g>

              <circle
                cx="140"
                cy="90"
                r="38"
                stroke="rgba(255, 255, 255, 0.14)"
                stroke-width="1"
                class="eye-core-ring"
              />
              <circle
                cx="140"
                cy="90"
                r="32"
                fill="url(#iris-grad)"
                filter="url(#eye-glow-deep)"
                class="iris"
              />
              <circle
                cx="140"
                cy="90"
                r="25"
                stroke="rgba(255, 255, 255, 0.18)"
                stroke-width="0.8"
                stroke-dasharray="2 5"
                class="eye-core-ring inner"
              />
              <path
                d="M 140 66 Q 148 90 140 114 Q 132 90 140 66 Z"
                fill="#000"
                class="pupil-slit"
              />
              <circle cx="140" cy="90" r="3" fill="#fff" />
              <ellipse
                cx="132"
                cy="80"
                rx="3"
                ry="6"
                fill="rgba(255, 255, 255, 0.45)"
                transform="rotate(-20 132 80)"
              />
              <circle cx="104" cy="55" r="1.8" fill="#ff2a44" class="eye-spark" />
              <circle
                cx="181"
                cy="124"
                r="1.4"
                fill="#ffffff"
                fill-opacity="0.65"
                class="eye-spark delayed"
              />
              <line
                x1="60"
                y1="90"
                x2="220"
                y2="90"
                stroke="rgba(255, 42, 68, 0.85)"
                stroke-width="1.2"
                class="radar-scan"
              />
            </svg>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
